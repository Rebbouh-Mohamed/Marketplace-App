<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::div})}">

<body>
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100 mt-10">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Welcome Back</h2>

        <div th:if="${param.registered}" class="mb-4 p-3 bg-green-50 text-green-700 rounded-lg text-sm text-center">
            Registration successful! Please login.
        </div>
        <div th:if="${param.error}" class="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm text-center">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="mb-4 p-3 bg-blue-50 text-blue-700 rounded-lg text-sm text-center">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <button type="submit"
                class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition">
                Sign In
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Don't have an account? <a href="/register" class="text-blue-600 hover:underline font-medium">Sign up</a>
        </p>
    </div>
</body>

</html>
