<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::div})}">

<body>
    <div class="container mx-auto max-w-4xl py-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6">My Conversations</h1>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(chatRooms)}" class="text-center py-16">
            <svg class="mx-auto h-16 w-16 text-gray-400 dark:text-gray-600 mb-4" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                </path>
            </svg>
            <p class="text-gray-500 dark:text-gray-400 text-lg mb-4">No conversations yet</p>
            <p class="text-gray-400 dark:text-gray-500 text-sm">Start chatting with sellers from product pages!</p>
            <a href="/products"
                class="inline-block mt-6 px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">
                Browse Products
            </a>
        </div>

        <!-- Chat List -->
        <div th:unless="${#lists.isEmpty(chatRooms)}" class="space-y-3">
            <div th:each="room : ${chatRooms}"
                class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 hover:shadow-lg transition-shadow">
                <a th:href="@{/chat/room/{id}(id=${room.id})}" class="block p-4">
                    <div class="flex gap-4">
                        <!-- Product Thumbnail -->
                        <div class="flex-shrink-0">
                            <img th:if="${room.product.images != null && !room.product.images.isEmpty()}"
                                th:src="${room.product.images[0].imageUrl.startsWith('http') ? room.product.images[0].imageUrl : '/images/' + room.product.images[0].imageUrl}"
                                alt="Product" class="w-20 h-20 rounded-lg object-cover">
                            <div th:unless="${room.product.images != null && !room.product.images.isEmpty()}"
                                class="w-20 h-20 rounded-lg bg-gray-200 dark:bg-gray-700 flex items-center justify-center">
                                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </div>
                        </div>

                        <!-- Chat Info -->
                        <div class="flex-1 min-w-0">
                            <!-- Header -->
                            <div class="flex items-start justify-between mb-2">
                                <h3 class="font-semibold text-gray-900 dark:text-white truncate"
                                    th:text="${room.product.title}">Product Title</h3>
                                <span th:if="${room.lastMessageTime != null}"
                                    class="text-xs text-gray-500 dark:text-gray-400 ml-2 flex-shrink-0"
                                    th:text="${#temporals.format(room.lastMessageTime, 'dd/MM HH:mm')}">12/01
                                    14:30</span>
                            </div>

                            <!-- Participant Info -->
                            <div class="flex items-center gap-2 mb-2">
                                <div
                                    class="w-6 h-6 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center text-xs font-semibold text-gray-600 dark:text-gray-300 overflow-hidden">
                                    <img th:if="${room.getOtherParticipant(currentUser.id).avatarUrl != null}"
                                        th:src="${room.getOtherParticipant(currentUser.id).avatarUrl}"
                                        class="w-full h-full object-cover">
                                    <span th:unless="${room.getOtherParticipant(currentUser.id).avatarUrl != null}"
                                        th:text="${#strings.substring(room.getOtherParticipant(currentUser.id).username, 0, 1).toUpperCase()}">U</span>
                                </div>
                                <span class="text-sm text-gray-600 dark:text-gray-400"
                                    th:text="${room.getOtherParticipant(currentUser.id).username}">Username</span>
                            </div>

                            <!-- Last Message -->
                            <div class="flex items-center justify-between">
                                <p class="text-sm text-gray-500 dark:text-gray-400 truncate"
                                    th:text="${room.lastMessage != null ? room.lastMessage : 'No messages yet'}">Last
                                    message preview...</p>

                                <!-- Unread Badge -->
                                <span
                                    th:if="${(room.buyer.id == currentUser.id ? room.unreadCountBuyer : room.unreadCountSeller) > 0}"
                                    class="ml-2 flex-shrink-0 inline-flex items-center justify-center w-6 h-6 text-xs font-bold text-white bg-red-500 rounded-full"
                                    th:text="${room.buyer.id == currentUser.id ? room.unreadCountBuyer : room.unreadCountSeller}">3</span>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
