<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::div})}">

<body>
    <div class="container mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Marketplace</h1>
            <a href="/products/new"
                class="px-6 py-2.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition font-medium shadow-md">
                + Sell Product
            </a>
        </div>

        <div class="grid grid-cols-12 gap-8">
            <!-- Sidebar Filters -->
            <div class="col-span-12 md:col-span-3">
                <div
                    class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 sticky top-24">
                    <form action="/products" method="get" id="filterForm">
                        <!-- Search -->
                        <div class="mb-6">
                            <label
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Search</label>
                            <input type="text" name="q" th:value="${q}" placeholder="Keywords..."
                                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                        </div>

                        <!-- Categories -->
                        <div class="mb-6">
                            <h3 class="font-bold text-gray-900 dark:text-white mb-3">Categories</h3>
                            <div class="space-y-2 max-h-60 overflow-y-auto">
                                <label
                                    class="flex items-center space-x-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 p-1 rounded">
                                    <input type="radio" name="category" value=""
                                        th:checked="${selectedCategory == null || selectedCategory == ''}"
                                        class="text-blue-600 focus:ring-blue-500 border-gray-300">
                                    <span class="text-gray-700 dark:text-gray-300 text-sm">All Categories</span>
                                </label>
                                <div th:each="cat : ${categories}">
                                    <label
                                        class="flex items-center space-x-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 p-1 rounded">
                                        <input type="radio" name="category" th:value="${cat.name}"
                                            th:checked="${selectedCategory == cat.name}"
                                            class="text-blue-600 focus:ring-blue-500 border-gray-300">
                                        <span class="text-gray-700 dark:text-gray-300 text-sm"
                                            th:text="${cat.name}">Electronics</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Price -->
                        <div class="mb-6">
                            <h3 class="font-bold text-gray-900 dark:text-white mb-3">Price Range</h3>
                            <div class="flex space-x-2">
                                <div class="relative w-1/2">
                                    <span class="absolute left-3 top-2 text-gray-500 dark:text-gray-400">DA</span>
                                    <input type="number" name="minPrice" th:value="${minPrice}" placeholder="Min"
                                        class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <div class="relative w-1/2">
                                    <span class="absolute left-3 top-2 text-gray-500 dark:text-gray-400">DA</span>
                                    <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="Max"
                                        class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500">
                                </div>
                            </div>
                        </div>

                        <!-- Condition -->
                        <div class="mb-6">
                            <h3 class="font-bold text-gray-900 dark:text-white mb-3">Condition</h3>
                            <select name="condition"
                                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-blue-500 focus:border-blue-500 text-sm bg-white dark:bg-gray-700">
                                <option value="">Any Condition</option>
                                <option value="NEW" th:selected="${condition == 'NEW'}">New</option>
                                <option value="USED_LIKE_NEW" th:selected="${condition == 'USED_LIKE_NEW'}">Used - Like
                                    New</option>
                                <option value="USED_GOOD" th:selected="${condition == 'USED_GOOD'}">Used - Good</option>
                                <option value="USED_FAIR" th:selected="${condition == 'USED_FAIR'}">Used - Fair</option>
                            </select>
                        </div>

                        <button type="submit"
                            class="w-full py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-bold shadow-md">
                            Apply Filters
                        </button>

                        <a href="/products" th:if="${q != null || selectedCategory != null || minPrice != null}"
                            class="block text-center mt-4 text-sm text-gray-500 hover:text-gray-800 underline">
                            Clear Filters
                        </a>
                    </form>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="col-span-12 md:col-span-9">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div th:each="product : ${products}"
                        class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-md transition group overflow-hidden">
                        <div class="aspect-w-16 aspect-h-9 bg-gray-200 dark:bg-gray-700 relative overflow-hidden h-48">
                            <img th:if="${!product.images.isEmpty()}"
                                th:src="${product.images[0].imageUrl.startsWith('http') ? product.images[0].imageUrl : '/images/' + product.images[0].imageUrl}"
                                class="object-cover w-full h-full transform group-hover:scale-105 transition duration-500"
                                alt="Product Image">
                            <div th:if="${product.images.isEmpty()}"
                                class="flex items-center justify-center h-full text-gray-400 bg-gray-100 dark:bg-gray-700">
                                <span>No Image</span>
                            </div>

                            <!-- Like Button -->
                            <div class="absolute top-3 right-3">
                                <button th:data-product-id="${product.id}"
                                    th:classappend="${likedProductIds != null && likedProductIds.contains(product.id) ? 'text-red-500' : ''}"
                                    class="like-button w-8 h-8 rounded-full bg-white/90 dark:bg-gray-800/90 backdrop-blur text-gray-400 hover:text-red-500 shadow-sm flex items-center justify-center transition">
                                    <svg class="w-4 h-4"
                                        th:fill="${likedProductIds != null && likedProductIds.contains(product.id) ? 'currentColor' : 'none'}"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z">
                                        </path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 mb-1"
                                        th:text="${product.category.name}">Category
                                    </p>
                                    <h3 class="font-bold text-gray-900 dark:text-white mb-1 line-clamp-1">
                                        <a th:href="@{'/products/' + ${product.id}}" th:text="${product.title}"
                                            class="hover:text-blue-500 transition">Product
                                            Title</a>
                                    </h3>
                                </div>
                            </div>
                            <div class="flex justify-between items-end mt-4">
                                <span class="text-xl font-bold text-gray-900 dark:text-white"
                                    th:text="${product.price + ' DA'}">100 DA</span>
                                <span class="text-xs text-gray-500 dark:text-gray-400"
                                    th:text="${#temporals.format(product.createdAt, 'MMM d')}">Oct 24</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="mt-10 flex justify-center" th:if="${products.totalPages > 1}">
                    <nav class="flex space-x-2">
                        <a th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                            th:href="@{/products(page=${i})}" th:text="${i + 1}"
                            class="px-4 py-2 border rounded-lg hover:bg-gray-50 text-gray-700"
                            th:classappend="${i == products.number} ? 'bg-blue-600 text-white border-blue-600 hover:bg-blue-700'">1</a>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
