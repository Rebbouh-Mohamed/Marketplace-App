<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::div})}">

<body>
    <div class="container mx-auto max-w-6xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <!-- Image Gallery -->
            <div class="space-y-4">
                <div class="aspect-w-4 aspect-h-3 bg-gray-100 rounded-2xl overflow-hidden shadow-sm">
                    <img th:if="${!product.images.isEmpty()}"
                        th:src="${product.images[0].imageUrl.startsWith('http') ? product.images[0].imageUrl : '/images/' + product.images[0].imageUrl}"
                        class="object-cover w-full h-full" id="mainImage" alt="Main Product Image">
                    <div th:if="${product.images.isEmpty()}"
                        class="flex items-center justify-center h-full text-gray-400">No Image</div>
                </div>
                <div class="flex space-x-4 overflow-x-auto pb-2" th:if="${product.images.size() > 1}">
                    <button th:each="img : ${product.images}"
                        class="w-20 h-20 flex-shrink-0 rounded-lg overflow-hidden border-2 hover:border-blue-600 transition cursor-pointer">
                        <img th:src="${img.imageUrl.startsWith('http') ? img.imageUrl : '/images/' + img.imageUrl}"
                            class="object-cover w-full h-full"
                            onclick="document.getElementById('mainImage').src=this.src">
                    </button>
                </div>
            </div>

            <!-- Product Info -->
            <div class="h-full">
                <nav class="flex text-sm text-gray-500 dark:text-gray-400 mb-4 space-x-2">
                    <a href="/products" class="hover:text-blue-600 dark:hover:text-blue-400">Home</a>
                    <span>/</span>
                    <a href="#" class="hover:text-blue-600 dark:hover:text-blue-400"
                        th:text="${product.category.name}">Category</a>
                </nav>

                <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2" th:text="${product.title}">Product
                    Title</h1>
                <div class="flex items-center space-x-4 mb-6">
                    <span class="text-3xl font-bold text-blue-600 dark:text-blue-400"
                        th:text="${product.price + ' DA'}">999 DA</span>
                    <span
                        class="px-3 py-1 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300 rounded-full text-xs font-semibold uppercase tracking-wide"
                        th:text="${product.condition}">New</span>
                </div>

                <div
                    class="bg-gray-50 dark:bg-gray-800 p-6 rounded-xl border border-gray-100 dark:border-gray-700 mb-8">
                    <div class="flex items-center space-x-4 mb-4">
                        <div
                            class="w-12 h-12 bg-gray-200 dark:bg-gray-700 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 font-bold overflow-hidden">
                            <img th:if="${product.seller.avatarUrl != null}" th:src="${product.seller.avatarUrl}"
                                class="w-full h-full object-cover">
                            <span th:unless="${product.seller.avatarUrl != null}"
                                th:text="${#strings.substring(product.seller.username,0,1).toUpperCase()}">U</span>
                        </div>
                        <div>
                            <p class="font-semibold text-gray-900 dark:text-white" th:text="${product.seller.username}">
                                Seller Name</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Member since <span
                                    th:text="${#temporals.format(product.seller.createdAt, 'MMM yyyy')}">2023</span></p>
                        </div>
                    </div>
                    <a th:href="@{/chat/product/{id}(id=${product.id})}"
                        class="w-full block text-center py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 dark:shadow-none mb-3 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        Message Seller
                    </a>

                    <button id="likeButton" th:data-product-id="${product.id}"
                        th:classappend="${likedProductIds != null && likedProductIds.contains(product.id) ? 'active-like border-red-200 bg-red-50 dark:bg-red-900/10 dark:border-red-900/30' : ''}"
                        class="like-button w-full py-3 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-lg font-medium hover:bg-gray-50 dark:hover:bg-gray-600 transition flex items-center justify-center gap-2 group">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                            th:fill="${likedProductIds != null && likedProductIds.contains(product.id) ? 'currentColor' : 'none'}"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="transition"
                            th:classappend="${likedProductIds != null && likedProductIds.contains(product.id) ? 'text-red-500' : 'group-hover:text-red-500'}">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                        <span class="like-text"
                            th:text="${likedProductIds != null && likedProductIds.contains(product.id) ? 'Liked' : 'Add to Wishlist'}">Add
                            to
                            Wishlist</span>
                    </button>
                </div>

                <div class="prose max-w-none text-gray-700 dark:text-gray-300">
                    <h3 class="font-bold text-gray-900 dark:text-white mb-3">Description</h3>
                    <p th:text="${product.description}" class="whitespace-pre-line">Product description goes here...</p>
                </div>

                <div
                    class="mt-8 border-t border-gray-200 dark:border-gray-700 pt-6 text-sm text-gray-500 dark:text-gray-400 grid grid-cols-2 gap-4">
                    <div>
                        <span class="block font-medium text-gray-700 dark:text-gray-300">Location</span>
                        <span th:text="${product.location}">New York, NY</span>
                    </div>
                    <div>
                        <span class="block font-medium text-gray-700 dark:text-gray-300">Posted</span>
                        <span th:text="${#temporals.format(product.createdAt, 'MMM d, yyyy')}">Oct 24, 2024</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
