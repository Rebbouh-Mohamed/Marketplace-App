<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::div})}">

<body>
    <div> <!-- WRAPPER DIV TO INCLUDE SCRIPTS IN LAYOUT -->
        <div class="container mx-auto max-w-4xl py-8">
            <!-- Header Section -->
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900" th:text="${productTitle}">Product Title</h2>
                    <div class="text-sm text-gray-500">
                        Chatting with <span class="font-medium text-blue-600" th:text="${receiverName}">Receiver</span>
                    </div>
                </div>
                <a href="/chat"
                    class="text-sm font-medium text-gray-600 hover:text-gray-900 flex items-center gap-1 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Back to Messages
                </a>
            </div>

            <!-- Chat Container -->
            <div
                class="bg-white rounded-3xl shadow-xl shadow-blue-900/5 border border-gray-100 overflow-hidden flex flex-col min-h-[600px]">
                <!-- Messages Area -->
                <div id="chatBox" class="flex-grow p-6 overflow-y-auto bg-gray-50/50 space-y-4" style="height: 450px;">
                    <!-- Messages will load here -->
                    <div class="flex justify-center items-center h-full text-gray-400 italic">
                        Loading conversation...
                    </div>
                </div>

                <!-- Input Area -->
                <div class="p-6 bg-white border-t border-gray-100">
                    <div class="flex gap-3">
                        <input type="text" id="messageInput" placeholder="Write a message..."
                            class="flex-1 px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500/20 outline-none transition text-sm">
                        <button id="sendBtn"
                            class="px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 disabled:opacity-50">
                            Send
                        </button>
                    </div>
                    <!-- Status Bar -->
                    <div id="status" class="mt-4 flex items-center gap-2 text-xs text-gray-400">
                        <div id="statusIndicator" class="w-1.5 h-1.5 rounded-full bg-gray-300"></div>
                        <span id="statusText">Connecting...</span>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            const productId = [[${ productId }]];
            const currentUserId = [[${ currentUserId }]];
            const currentUserName = [[${ currentUserName }]];
            const receiverId = [[${ receiverId }]];

            let lastMessageId = 0;
            let pollingInterval;
            let isSending = false;

            function updateStatus(text, type) {
                const statusText = document.getElementById('statusText');
                const indicator = document.getElementById('statusIndicator');
                if (!statusText || !indicator) return;
                statusText.textContent = text;
                indicator.className = 'w-1.5 h-1.5 rounded-full ' + (
                    type === 'success' ? 'bg-green-500' :
                        type === 'error' ? 'bg-red-500' :
                            type === 'working' ? 'bg-blue-500 pulse' : 'bg-gray-300'
                );
            }

            function displayMessage(msg) {
                const chatBox = document.getElementById('chatBox');
                if (!chatBox) return;

                if (lastMessageId === 0) chatBox.innerHTML = '';
                if (document.querySelector(`[data-id="${msg.id}"]`)) return;

                const isMine = msg.senderId == currentUserId;
                const messageDiv = document.createElement('div');
                messageDiv.setAttribute('data-id', msg.id);
                messageDiv.className = `flex ${isMine ? 'justify-end' : 'justify-start'}`;

                const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                messageDiv.innerHTML = `
                    <div class="max-w-[80%] px-5 py-3 rounded-2xl shadow-sm ${isMine ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border border-gray-100 text-gray-900 rounded-tl-none'
                    }">
                        <div class="text-[10px] uppercase tracking-wider font-bold mb-1 opacity-70">
                            ${isMine ? 'You' : msg.senderName}
                        </div>
                        <div class="text-sm leading-relaxed">${msg.content}</div>
                        <div class="text-[9px] mt-1 opacity-50 text-right italic">${time}</div>
                    </div>
                `;

                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                if (msg.id > lastMessageId) lastMessageId = msg.id;
            }

            async function sendMessage() {
                const input = document.getElementById('messageInput');
                const content = input.value.trim();
                if (!content || isSending) return;

                isSending = true;
                updateStatus('Sending...', 'working');

                try {
                    const response = await fetch('/api/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ productId, senderId: currentUserId, senderName: currentUserName, receiverId, content })
                    });

                    if (!response.ok) throw new Error('Send failed');
                    const result = await response.json();
                    displayMessage(result.message);
                    input.value = '';
                    updateStatus('Connected', 'success');
                } catch (error) {
                    updateStatus('Failed to send', 'error');
                } finally {
                    isSending = false;
                }
            }

            async function fetchMessages() {
                try {
                    const url = lastMessageId > 0
                        ? `/api/chat/messages/${productId}?afterId=${lastMessageId}`
                        : `/api/chat/messages/${productId}`;

                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Fetch failed');
                    const messages = await response.json();

                    if (messages.length > 0) {
                        messages.forEach(displayMessage);
                    }
                    updateStatus('Connected', 'success');
                } catch (error) {
                    updateStatus('Reconnecting...', 'error');
                }
            }

            // CSS for pulse
            const style = document.createElement('style');
            style.textContent = `@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } } .pulse { animation: pulse 1.5s infinite; }`;
            document.head.appendChild(style);

            // Initialize polling after internal check
            fetchMessages();
            pollingInterval = setInterval(fetchMessages, 3000);

            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', (e) => e.key === 'Enter' && sendMessage());
        </script>
    </div>
</body>

</html>
