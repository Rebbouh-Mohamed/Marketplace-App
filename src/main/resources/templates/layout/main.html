<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Oudekeniss</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="/js/likes.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .gradient-text {
            background: linear-gradient(to right, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <script>
        // Check for saved theme preference or system preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }
    </script>
</head>

<body
    class="bg-gray-50 text-slate-800 dark:bg-gray-900 dark:text-gray-100 flex flex-col min-h-screen transition-colors duration-300">

    <!-- Header -->
    <header
        class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 dark:border-gray-800 transition-colors duration-300">
        <nav class="container mx-auto px-4 h-16 flex justify-between items-center">
            <!-- Logo -->
            <a href="/" class="text-2xl font-bold tracking-tight flex items-center gap-2">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-violet-600 flex items-center justify-center text-white font-bold text-lg">
                    O</div>
                <span class="text-gray-900 dark:text-white">Oudekeniss</span>
            </a>

            <!-- Navigation -->
            <div class="hidden md:flex space-x-8 items-center">
                <a href="/"
                    class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition text-sm">Home</a>
                <a href="/products"
                    class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition text-sm">Browse</a>
                <a th:if="${#authorization.expression('isAuthenticated()')}" href="/chat"
                    class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition text-sm relative">
                    Messages
                    <!-- Notification dot placeholder -->
                    <span class="absolute -top-1 -right-2 w-2 h-2 bg-red-500 rounded-full"></span>
                </a>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-4">

                <!-- Dark Mode Toggle -->
                <button onclick="toggleTheme()"
                    class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition">
                    <!-- Sun Icon (Hidden in Dark) -->
                    <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <!-- Moon Icon (Hidden in Light) -->
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                        </path>
                    </svg>
                </button>

                <a href="/products/new"
                    class="hidden md:flex items-center gap-2 px-5 py-2.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 text-sm font-medium rounded-full hover:bg-gray-800 dark:hover:bg-gray-100 transition shadow-lg shadow-gray-200 dark:shadow-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Sell Product
                </a>

                <div th:if="${#authorization.expression('isAuthenticated()')}" class="relative"
                    x-data="{ open: false }">
                    <button @click="open = !open" @click.outside="open = false"
                        class="flex items-center gap-2 focus:outline-none">
                        <div
                            class="w-9 h-9 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center text-blue-700 dark:text-blue-300 font-bold border border-blue-200 dark:border-blue-800">
                            <span th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                        </div>
                    </button>

                    <!-- Dropdown -->
                    <div x-show="open" x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-75"
                        x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                        class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-100 dark:border-gray-700 py-1 origin-top-right z-50">

                        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700">
                            <p class="text-sm font-medium text-gray-900 dark:text-white"
                                th:text="${#authentication.name}">User</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">View Profile</p>
                        </div>

                        <a href="/profile"
                            class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700">Dashboard</a>
                        <a href="/chat"
                            class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700">Messages</a>
                        <a href="/products/new"
                            class="md:hidden block px-4 py-2 text-sm text-blue-600 dark:text-blue-400 font-medium hover:bg-gray-50 dark:hover:bg-gray-700">Sell
                            Product</a>

                        <div class="border-t border-gray-100 dark:border-gray-700 mt-1">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit"
                                    class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20">Logout</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div th:unless="${#authorization.expression('isAuthenticated()')}" class="flex items-center gap-3">
                    <a href="/login"
                        class="text-sm font-medium text-gray-700 dark:text-gray-200 hover:text-blue-600 transition">Log
                        In</a>
                    <a href="/register"
                        class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-full hover:bg-blue-700 transition shadow-md shadow-blue-200 dark:shadow-none">Sign
                        Up</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">
        <!-- Content placeholder -->
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer
        class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 mt-auto transition-colors duration-300">
        <div class="container mx-auto px-4 py-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <div class="flex items-center gap-2 mb-2">
                        <div
                            class="w-6 h-6 rounded bg-gray-900 dark:bg-white flex items-center justify-center text-white dark:text-gray-900 font-bold text-xs">
                            O</div>
                        <span class="font-bold text-gray-900 dark:text-white">Oudekeniss</span>
                    </div>
                    <p class="text-sm text-gray-500 dark:text-gray-400">The best place to buy and sell anything.</p>
                </div>
                <div class="flex gap-6 text-sm text-gray-500 dark:text-gray-400">
                    <a href="#" class="hover:text-gray-900 dark:hover:text-white">Terms</a>
                    <a href="#" class="hover:text-gray-900 dark:hover:text-white">Privacy</a>
                    <a href="#" class="hover:text-gray-900 dark:hover:text-white">Contact</a>
                </div>
            </div>
            <div
                class="border-t border-gray-100 dark:border-gray-800 mt-8 pt-8 text-center text-xs text-gray-400 dark:text-gray-500">
                &copy; 2024 Oudekeniss Inc. All rights reserved.
            </div>
        </div>
    </footer>

</body>

</html>
